<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Eventos</title>
</head>
<body>

    <h1>Lista de eventos</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Local</th>
                <th>Data</th>
                <th>Horário</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="evento : ${eventos}">
                <td th:text="${evento.id}">1</td>
                <td th:text="${evento.nome}">Aniversário</td>
                <td th:text="${evento.local}">Clube</td>
                <td th:text="${evento.data}">10/10/2026</td>
                <td th:text="${evento.horario}">19:00</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
